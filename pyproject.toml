[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextaudit"
version = "1.0.0"
description = "Bounded read-only web and Next.js security posture inspection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hossein"}]
keywords = ["security", "nextjs", "sast", "sourcemaps", "http", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "build>=1.2"]

[project.scripts]
nextaudit = "nextaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
