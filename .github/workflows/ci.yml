name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint primary package and tests
        run: python -m ruff check src/nextaudit/scanner.py src/nextaudit/reports.py src/nextaudit/cli.py tests
      - name: CLI checks
        run: |
          nextaudit --version
          nextaudit scan --help
          nextaudit access --help
          nextaudit demo-scan --output /tmp/nextaudit-demo.json
      - name: Wheel and sdist
        run: python -m build
      - name: Install generated wheel and verify CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          nextaudit --version
      - name: Inspect archives
        run: |
          python -m pip install twine
          python -m twine check dist/*
  local-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Payment fixtures, localhost only
        run: nextaudit demo
